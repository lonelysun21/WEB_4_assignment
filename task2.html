<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Task 2 - Bootstrap Forms</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<nav>
		<a href="index.html">Task 0</a>
		<a href="task1.html">Task 1</a>
		<a href="task2.html">Task 2</a>
		<a href="task3.html">Task 3</a>
		<a href="task4.html">Task 4</a>
	</nav>
	<main>
		<h1>Task 2: Bootstrap Contact Form</h1>
		<form class="row g-3" method="get">
			<div class="col-md-6">
				<label for="name" class="form-label">Name</label>
				<input type="text" id="name" name="name" class="form-control"
					placeholder="Your name" required maxlength="50">
			</div>
			<div class="col-md-6">
				<label for="email" class="form-label">Email</label>
				<input type="email" id="email" name="email" class="form-control"
					placeholder="name@example.com" required
					aria-describedby="email-help">
				<div id="email-help" class="form-text">
					We will not share your email.
				</div>
			</div>
			<div class="col-12">
				<label for="message" class="form-label">Message</label>
				<textarea id="message" name="message" class="form-control"
					rows="5" placeholder="Write your message"
					required maxlength="500"></textarea>
			</div>
			<div class="col-12">
				<button type="submit" class="btn btn-primary">Submit</button>
			</div>
		</form>
	</main>
</body>
</html>
